description:
  en: "Create cinematic product videos from shot recipe cards, a validated template, and code/audio assets (Remotion + real page screenshots + 2.5D camera moves + beat-synced cuts + sound design). Use when the user asks to turn a frontend project or webpage into a product video, says \"use video-shotcraft to make a video/promo\", names the Ink Press template or asks to reproduce its effect, or wants a single shot card's motion."
  zh: "用镜头配方卡 + 已验收模板 + 代码／音频资产制作电影感产品视频（Remotion + 真实页面截图 + 2.5D 运镜 + 节奏卡点 + 声音设计）。当用户要求把前端项目或网页做成产品视频、说「用 video-shotcraft 做视频／宣传片」、点名 Ink Press 模板或要求复刻其效果，或想用镜头卡做单个动效镜头时使用。"
