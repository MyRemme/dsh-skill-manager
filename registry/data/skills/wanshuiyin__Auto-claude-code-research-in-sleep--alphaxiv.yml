description:
  en: Quick single-paper lookup via AlphaXiv LLM-optimized summaries with tiered source fallback. Use when user says "explain this paper", "summarize paper", pastes an arXiv/AlphaXiv URL, or provides a bare arXiv ID for quick understanding - not for broad literature search.
  zh: "用 AlphaXiv 面向 LLM 优化的摘要快速查询单篇论文，带分层的数据源回退。适用于用户说「讲讲这篇论文」「总结这篇论文」，粘贴 arXiv/AlphaXiv 链接，或只给一个 arXiv ID 想快速了解——不适用于大范围文献检索。"
