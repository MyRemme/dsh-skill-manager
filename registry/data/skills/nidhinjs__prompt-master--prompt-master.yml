description:
  en: Generates optimized prompts for AI tools. Activates only when the user explicitly asks to write, fix, improve, or adapt a prompt for a specific AI tool (LLM, Cursor, Midjourney, image AI, video AI, coding agents, etc.). Does not activate for general conversation, coding tasks, document writing, or other non-prompt-engineering work.
  zh: "为 AI 工具生成优化后的提示词。仅在用户明确要求为某个具体 AI 工具（LLM、Cursor、Midjourney、图像 AI、视频 AI、编码智能体等）撰写、修正、改进或改写提示词时启用。日常对话、编码任务、文档写作或其他与提示词工程无关的工作不会触发。"
