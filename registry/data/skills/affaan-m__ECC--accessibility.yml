description:
  en: Design, implement, and audit accessible UI to WCAG 2.2 Level AA across Web, iOS, and Android — semantic ARIA roles and labels, accessibility traits and hints, focus management, contrast, target size, and screen-reader support. Use when building or auditing UI for accessibility compliance, keyboard navigation, or screen-reader support.
  zh: "设计、实现并审计符合 WCAG 2.2 AA 级的无障碍界面，覆盖 Web、iOS 与 Android——语义化 ARIA 角色与标签、无障碍特征与提示、焦点管理、对比度、触控目标尺寸与屏幕阅读器支持。适用于为无障碍合规、键盘导航或屏幕阅读器支持而构建或审计界面。"
