  en: When the user wants help with paid advertising campaigns on Google Ads, Meta (Facebook/Instagram), LinkedIn, Twitter/X, or other ad platforms. Also use when the user mentions 'PPC,' 'paid media,' 'ROAS,' 'CPA,' 'ad campaign,' 'retargeting,' 'audience targeting,' 'Google Ads,' 'Facebook ads,' 'LinkedIn ads,' 'ad budget,' 'cost per click,' 'ad spend,' 'should I run ads,' 'ABM,' 'account-based marketing,' 'B2B ads,' 'lead quality,' 'negative keywords,' 'Performance Max,' 'thought leader ads,' 'when should I kill an ad,' 'search terms report,' 'wasted spend,' or 'is this campaign working.' Use this for campaign strategy, audience targeting, bidding, and optimization. For bulk ad creative generation and iteration, see ad-creative. For landing page optimization, see cro.
  zh: "Google Ads、Meta（Facebook / Instagram）、LinkedIn、X 等平台的付费广告投放。涉及 PPC、付费媒体、ROAS、CPA、重定向、人群定向、预算与出价、否定关键词、Performance Max、搜索词报告、浪费支出排查以及 ABM 时使用。负责投放策略、受众与出价优化；批量素材产出见 ad-creative，落地页优化见 cro。"
