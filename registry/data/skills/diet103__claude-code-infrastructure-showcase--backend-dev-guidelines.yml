description:
  en: Comprehensive backend development guide for Node.js/Express/TypeScript microservices. Use when creating routes, controllers, services, repositories, middleware, or working with Express APIs, Prisma database access, Sentry error tracking, Zod validation, unifiedConfig, dependency injection, or async patterns. Covers layered architecture (routes → controllers → services → repositories), BaseController pattern, error handling, performance monitoring, testing strategies, and migration from legacy patterns.
  zh: "面向 Node.js/Express/TypeScript 微服务的后端开发指南。适用于编写路由、控制器、服务、仓储、中间件，或处理 Express API、Prisma 数据库访问、Sentry 错误追踪、Zod 校验、unifiedConfig、依赖注入与异步模式。涵盖分层架构（路由 → 控制器 → 服务 → 仓储）、BaseController 模式、错误处理、性能监控、测试策略以及从旧模式迁移。"
