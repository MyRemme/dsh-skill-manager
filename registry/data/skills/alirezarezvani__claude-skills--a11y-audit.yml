description:
  en: Accessibility audit skill for scanning, fixing, and verifying WCAG 2.2 Level A and AA compliance across React, Next.js, Vue, Angular, Svelte, and plain HTML codebases. Use when auditing accessibility, fixing a11y violations, checking color contrast, generating compliance reports, or integrating accessibility checks into CI/CD pipelines.
  zh: "无障碍审计技能：扫描、修复并验证 React、Next.js、Vue、Angular、Svelte 与原生 HTML 代码库是否符合 WCAG 2.2 A 级与 AA 级。适用于无障碍审计、修复 a11y 问题、检查色彩对比度、生成合规报告，或把无障碍检查接入 CI/CD 流水线。"
