description:
  en: State-space model with O(n) complexity vs Transformers' O(n²). 5× faster inference, million-token sequences, no KV cache. Selective SSM with hardware-aware design. Mamba-1 (d_state=16) and Mamba-2 (d_state=128, multi-head). Models 130M-2.8B on HuggingFace.
  zh: "状态空间模型，复杂度为 O(n)，而 Transformer 是 O(n²)。推理快 5 倍，可处理百万级 token 序列，无需 KV 缓存。选择性 SSM 配硬件感知设计，含 Mamba-1（d_state=16）与 Mamba-2（d_state=128，多头）。HuggingFace 上有 130M 到 2.8B 的模型。"
