description:
  en: This skill should be used for time series machine learning tasks including classification, regression, clustering, forecasting, anomaly detection, segmentation, and similarity search. Use when working with temporal data, sequential patterns, or time-indexed observations requiring specialized algorithms beyond standard ML approaches. Particularly suited for univariate and multivariate time series analysis with scikit-learn compatible APIs.
  zh: "用于时间序列机器学习任务，包括分类、回归、聚类、预测、异常检测、分段与相似性检索。适用于时序数据、序列模式或按时间索引的观测，需要超出标准机器学习方法的专门算法时。尤其适合单变量与多变量时间序列分析，提供与 scikit-learn 兼容的 API。"
