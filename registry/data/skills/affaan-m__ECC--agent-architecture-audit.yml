description:
  en: Full-stack diagnostic for agent and LLM applications. Audits the 12-layer agent stack for wrapper regression, memory pollution, tool discipline failures, hidden repair loops, and rendering corruption. Produces severity-ranked findings with code-first fixes. Essential for developers building agent applications, autonomous loops, or any LLM-powered feature. Use when an agent or LLM feature misbehaves and the failing layer is unknown, or before shipping an agent stack.
  zh: "面向智能体与 LLM 应用的全栈诊断。审计智能体 12 层技术栈中的包装层回归、记忆污染、工具调用失范、隐藏修复循环与渲染错乱，输出按严重度排序的结论并给出代码级修复方案。适合构建智能体应用、自主循环或任何 LLM 功能的开发者。当智能体或 LLM 功能行为异常而不知道是哪一层的问题，或上线前做整体体检时使用。"
