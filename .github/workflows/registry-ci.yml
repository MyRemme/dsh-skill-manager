name: Registry CI

on:
  pull_request:
    paths:
      - "registry/**"
      - "lib/**"
      - "test/**"
      - "package.json"
      - "cordis.patch.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The plugin ships no dependencies, so there is nothing to install.
      - name: Entry validation and catalog freshness
        run: node registry/scripts/build-registry.mjs --check

      - name: Upstream verification
        run: node registry/scripts/build-registry.mjs --check --verify
        env:
          # A token lifts the unauthenticated 60 requests/hour ceiling. Transient
          # failures are warnings by default, so a rate limit cannot fail a PR.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tests
        run: node --test "test/**/*.test.mjs"

      - name: Documentation language
        run: node scripts/check-docs.mjs
